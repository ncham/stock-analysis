version: "3.9"

services:
  backend:
    build:
      context: ./app
    volumes:
      - ./app:/app
      - ./data:/data
    depends_on:
      - frontend

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
      - ./data:/data
    ports:
      - "5000:5000"

volumes:
  db_data:
